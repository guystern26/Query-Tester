<form class="form-horizontal">
    <div class="control-group">
        <label class="control-label" for="recipients">Email Recipients</label>
        <div class="controls">
            <input type="text" name="action.ai_summary.param.recipients" id="recipients"
                   placeholder="oncall@company.com, team@company.com" />
            <span class="help-block">Comma-separated email addresses. Falls back to default alert email if empty.</span>
        </div>
    </div>
    <div class="control-group">
        <label class="control-label" for="prompt">Custom Prompt (optional)</label>
        <div class="controls">
            <textarea name="action.ai_summary.param.prompt" id="prompt" rows="3"
                      placeholder="Leave empty for default AI summary. Or write a custom instruction for the AI."></textarea>
            <span class="help-block">Override the default analysis prompt. The AI receives this + the search results.</span>
        </div>
    </div>
</form>
